<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamDeck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes slideOutRight {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(24px); }
    }
    .toast-enter { animation: slideInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .toast-exit { animation: slideOutRight 0.2s ease-in forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans relative">

  <!-- Floating Toast Notifications -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 md:px-0"></div>

  <!-- Header with Navigation Tabs -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-4 md:px-8 py-3 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-30">
    <div class="flex items-center gap-6">
      <button onclick="switchTab('player')" class="flex items-center gap-2 group cursor-pointer focus:outline-none">
        <i class="fa-solid fa-play-circle text-indigo-500 text-2xl group-hover:text-indigo-400 transition"></i>
        <h1 class="text-lg font-bold tracking-tight">StreamDeck</h1>
      </button>

      <nav class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
        <button id="nav-player" onclick="switchTab('player')" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white font-medium transition cursor-pointer">
          <i class="fa-solid fa-film mr-1.5"></i> Player
        </button>
        <button id="nav-discover" onclick="switchTab('discover')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white font-medium transition cursor-pointer">
          <i class="fa-solid fa-compass mr-1.5"></i> Discover
        </button>
        <button id="nav-history" onclick="switchTab('history')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white font-medium transition cursor-pointer">
          <i class="fa-solid fa-clock-rotate-left mr-1.5"></i> Recently Watched
        </button>
      </nav>
    </div>

    <!-- Metadata & Settings -->
    <div class="flex items-center gap-3">
      <span id="show-metadata" class="text-xs text-slate-400 font-mono hidden md:inline"></span>
      <button type="button" onclick="toggleModal('settings-modal')" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer flex items-center gap-1.5">
        <i class="fa-solid fa-gear"></i> Settings
        <span id="trakt-status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col relative z-10">

    <!-- ================= TAB 1: PLAYER ================= -->
    <section id="tab-content-player" class="flex flex-col gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
        <div class="flex flex-wrap items-center gap-2.5">
          <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800">
            <button id="type-tv" type="button" onclick="setType('tv')" class="px-3 py-1 text-xs font-semibold rounded-md bg-indigo-600 text-white transition cursor-pointer">TV</button>
            <button id="type-movie" type="button" onclick="setType('movie')" class="px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition cursor-pointer">Movie</button>
          </div>

          <input id="input-id" type="text" placeholder="IMDb ID (e.g. tt0944947)" 
                 class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs w-36 md:w-44 focus:outline-none focus:border-indigo-500">

          <div id="tv-controls" class="flex items-center gap-1.5">
            <div class="flex items-center gap-1 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1">
              <span class="text-[11px] text-slate-400 font-bold">S</span>
              <input id="input-season" type="number" min="1" value="1" 
                     onchange="autoLoadIfActive()"
                     class="bg-transparent text-xs w-9 text-center focus:outline-none">
            </div>
            <div class="flex items-center gap-1 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1">
              <span class="text-[11px] text-slate-400 font-bold">E</span>
              <input id="input-episode" type="number" min="1" value="1" 
                     onchange="autoLoadIfActive()"
                     class="bg-transparent text-xs w-9 text-center focus:outline-none">
            </div>
          </div>

          <button type="button" onclick="loadPlayer()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3.5 py-1 rounded-lg text-xs transition cursor-pointer shadow-sm">
            <i class="fa-solid fa-play mr-1"></i> Play
          </button>
        </div>

        <button type="button" onclick="markAsWatchedTrakt(true)" class="flex items-center gap-1.5 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 border border-emerald-500/30 px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer">
          <i class="fa-solid fa-check"></i> <span>Watched</span>
        </button>
      </div>

      <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
        <iframe id="video-frame" src="" class="w-full h-full border-0" allowfullscreen></iframe>
        <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-slate-400">
          <i class="fa-solid fa-film text-4xl mb-3 text-slate-600"></i>
          <p class="text-sm">Enter an IMDb ID or choose a title from Discover / Recently Watched</p>
        </div>
      </div>
    </section>

    <!-- ================= TAB 2: DISCOVER ================= -->
    <section id="tab-content-discover" class="hidden flex-col gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
          <div>
            <h2 class="text-base font-bold text-slate-200">Discover Titles</h2>
            <p class="text-xs text-slate-400">Explore trending, popular, or your personal Trakt watchlist</p>
          </div>

          <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs flex-wrap">
            <button onclick="changeDiscoverCategory('shows', 'trending')" id="tab-shows-trending" class="px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium">Trending Shows</button>
            <button onclick="changeDiscoverCategory('movies', 'trending')" id="tab-movies-trending" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white">Trending Movies</button>
            <button onclick="changeDiscoverCategory('shows', 'popular')" id="tab-shows-popular" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white">Popular Shows</button>
            <button onclick="changeDiscoverCategory('movies', 'popular')" id="tab-movies-popular" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white">Popular Movies</button>
            <button onclick="changeDiscoverCategory('watchlist', 'all')" id="tab-watchlist" class="hidden px-2.5 py-1 rounded-md text-slate-400 hover:text-white border border-indigo-500/20">
              <i class="fa-solid fa-bookmark mr-1 text-indigo-400"></i> Watch List
            </button>
          </div>
        </div>

        <div id="discover-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 pt-1 min-h-[420px]"></div>

        <div id="discover-pagination" class="flex items-center justify-between border-t border-slate-800 pt-3">
          <button id="btn-page-prev" onclick="changePage(-1)" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 disabled:opacity-30 disabled:pointer-events-none transition cursor-pointer">
            <i class="fa-solid fa-chevron-left mr-1"></i> Previous
          </button>
          <span id="page-display" class="text-xs font-mono text-slate-400">Page 1</span>
          <button id="btn-page-next" onclick="changePage(1)" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white transition cursor-pointer">
            Next <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- ================= TAB 3: RECENTLY WATCHED ================= -->
    <section id="tab-content-history" class="hidden flex-col gap-6">
      <!-- 1. Local Recent Sessions -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
        <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
          <div>
            <h2 class="text-base font-bold text-slate-200">Local Sessions (Last 5)</h2>
            <p class="text-xs text-slate-400">Fast local browser storage with exact second timestamps</p>
          </div>
          <span class="text-xs text-indigo-400 font-mono bg-indigo-950/60 border border-indigo-800/40 px-2 py-0.5 rounded">Local Cache</span>
        </div>
        <div id="history-full-list" class="space-y-2.5"></div>
      </div>

      <!-- 2. Trakt In-Progress (Continue Watching) -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-
